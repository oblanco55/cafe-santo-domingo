services:
  db:
    image: postgres:16-alpine
    container_name: cafe_sd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafesantodomingo
    ports:
      - "5433:5432"
    volumes:
      - cafe-sd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafesantodomingo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafe-sd-db-data:

